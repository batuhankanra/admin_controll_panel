[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.2"
actix-web = "4.18.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["chrono", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
